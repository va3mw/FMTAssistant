# FMT Assistant settings for the checks that guide a measurement session.
#
# Each setting is "name = value". Lines starting with # are comments.
# The app keeps a copy of this file next to its other settings; edit that
# copy to change a check. Delete it to get these defaults back.

# ---------------------------------------------------------------- captures

# How long each FMT carrier is keyed down, in seconds. ARRL FMT key-downs
# last one minute.
key_down_sec = 60

# A run capture is "short" when its readings cover less than this fraction
# of the key-down. WSJT-X FreqCal on its 30 s T/R cycle covers only about
# :04 to :29, which is about 0.4 of a minute.
short_capture_fraction = 0.6

# If a run's readings stop before this second of the key-down minute and
# none follow, the capture is blamed on the 30 s T/R cycle.
half_cycle_last_sec = 31

# How many seconds after key-down to check live that readings are still
# arriving, so the operator can fix WSJT-X before the next run.
live_check_after_sec = 36

# Readings needed in the key-down minute before the live check can judge.
live_check_min_readings = 3

# How many readings from another slot's time window block a capture.
# A few stray readings at a window's edge are tolerated.
foreign_readings_block = 4

# A calibration capture is rejected when fewer than this fraction of its
# readings are on WWV/WWVH frequencies.
cal_min_wwv_fraction = 0.5

# Default time the operator plans to stay on each WWV frequency, seconds.
# A dwell much shorter than planned gets the same T/R cycle warning as a run.
cal_dwell_sec = 60

# A WWV dwell is "short" below this fraction of the planned dwell.
cal_dwell_short_fraction = 0.6

# Readings further apart than this, in seconds, start a new dwell.
dwell_gap_sec = 20

# ------------------------------------------------------------ calibrations

# Fewer usable readings than this on a WWV frequency is "too few".
cal_min_readings = 10

# A WWV frequency whose readings scatter more than this SD (Hz) is "too
# noisy". Skywave WWV on a fading path typically scatters 0.03-0.15 Hz.
cal_noisy_sd_hz = 0.2

# A WWV frequency steadier than this SD (Hz) is "suspiciously steady":
# skywave Doppler almost never stays this still for a whole dwell, so the
# signal may be a local spur or a different station.
cal_steady_sd_hz = 0.01

# Number of WWV frequencies a good calibration covers.
cal_min_freqs = 3

# The highest WWV frequency used should be at least this many times the
# lowest (2.5 and 10 MHz is 4 times), so the slope B can be measured.
cal_min_span_ratio = 4

# The slope B counts as measured when it is at least this many standard
# errors away from zero.
cal_slope_sigmas = 2

# ------------------------------------------------------------------- runs

# Confidence used to call a run's slope "drifting" (Student t test on the
# slope with N-2 degrees of freedom). 0.95 is about 2.3 SE for 10 readings.
slope_confidence = 0.95

# Fading: a run whose SD is this many times the session's typical SD
# (the median of the other runs) is a fading suspect.
fading_sd_ratio = 2

# Fading: with fewer than two other runs to compare with, a run SD above
# this many Hz is a fading suspect.
fading_sd_fallback_hz = 0.1

# Fading: lag-1 autocorrelation of the readings above this backs up a
# fading suspect (neighbouring readings move together, as in a slow fade).
fading_lag1 = 0.25

# Effective N: readings with a lag-1 autocorrelation above this get an
# effective N and a widened uncertainty in the analysis.
autocorr_note = 0.2

# --------------------------------------------------------------- analysis

# Runs whose errors agree within this many ppb of each other form a group
# with one systematic offset.
agree_ppb = 5

# An error larger than this many Hz is a blunder (a wrong dial or file),
# not something the reference or the ionosphere can do.
blunder_hz = 2

# Audio-clock check: if error / audio frequency varies across runs by more
# than this fraction of its mean, the sound card clock isn't the cause.
audio_clock_spread = 0.5

# Reference check: a ground-wave or GPS-locked carrier read within this
# many ppb of its true frequency means the reference is fine.
refcheck_ok_ppb = 2
